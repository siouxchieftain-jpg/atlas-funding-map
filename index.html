<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="The ATLAS Connect Funding Map is temporarily unavailable while updates are made.">
<title>ATLAS Connect Funding Map: temporarily unavailable</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F3F5F4;--surface:#FFFFFF;--ink:#14201B;--muted:#56665F;--faint:#6E7C76;--line:#D6DEDA;
  --cond:#9A600E;--cond-bg:#F6EAD6;
  --shadow:0 1px 2px rgba(20,32,27,.06),0 4px 14px rgba(20,32,27,.05);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --cond-font:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  color-scheme:dark;--bg:#0E1412;--surface:#151E1B;--ink:#E4ECE8;--muted:#9FB0A9;--faint:#8FA19A;--line:#2A3833;
  --cond:#E3B169;--cond-bg:#3A2C15;--shadow:0 1px 2px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);display:grid;place-items:center;min-height:100vh;padding:16px}
.wrap{width:100%;max-width:520px}
.eyebrow{font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font:600 30px/1.15 var(--cond-font);letter-spacing:-.01em;margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 22px 20px;box-shadow:var(--shadow)}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--cond-bg);color:var(--cond);border-radius:999px;padding:4px 12px;font:600 12px/1.2 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
h2{font:600 21px/1.25 var(--cond-font);margin:14px 0 8px}
p{margin:0;color:var(--muted)}
.meta{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font:400 12px/1.4 var(--mono);color:var(--faint)}
</style>
</head>
<body>
<main class="wrap">
  <p class="eyebrow">ATLAS Connect</p>
  <h1>Funding Map</h1>
  <section class="card" aria-labelledby="notice-title">
    <span class="pill">Temporarily unavailable</span>
    <h2 id="notice-title">We are updating the Funding Map</h2>
    <p>This page is temporarily unavailable while updates are made. It will be back soon. Thank you for your patience.</p>
    <div class="meta">Notice posted 7 October 2026</div>
  </section>
</main>
</body>
</html>
